#
# Tests on Windows, Linux, and macOS, then publishes one trimmed single-file
# build per platform. A tag such as v0.2.0 also creates a GitHub release.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test SharpShooter.slnx -c Release

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, package: windows }
          - { rid: linux-x64, os: ubuntu-latest, package: linux }
          - { rid: osx-x64, os: macos-latest, package: macos }
          - { rid: osx-arm64, os: macos-latest, package: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tags set the version (v1.2.3 -> 1.2.3). Other builds keep the project
      # version and add the run number, such as 0.1.0-ci.42.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(dotnet msbuild SharpShooter.csproj -getProperty:Version)
            version="${base}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Publish
        run: >
          dotnet publish SharpShooter.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o out

      # Windows: zip with the exe. Linux: tar (keeps the executable bit) with an
      # install script that adds a menu entry. macOS: a zipped SharpShooter.app.
      - name: Package
        id: package
        run: |
          name="SharpShooter-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          case "${{ matrix.package }}" in
            windows)
              cp README.md out/ && mkdir -p out/LICENSES && cp LICENSES/* out/LICENSES/
              (cd out && 7z a -tzip "../$name.zip" . > /dev/null)
              file="$name.zip" ;;
            linux)
              cp README.md out/ && mkdir -p out/LICENSES && cp LICENSES/* out/LICENSES/
              cp packaging/linux/install.sh packaging/linux/sharpshooter.png out/
              chmod +x out/SharpShooter out/install.sh
              tar -czf "$name.tar.gz" -C out .
              file="$name.tar.gz" ;;
            macos)
              bash packaging/macos/make-app.sh out "${{ steps.version.outputs.version }}" app
              ditto -c -k --sequesterRsrc --keepParent app/SharpShooter.app "$name.zip"
              file="$name.zip" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -la "$file"

      - uses: actions/upload-artifact@v4
        with:
          name: SharpShooter-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "SharpShooter $GITHUB_REF_NAME" --generate-notes
