# Keeps workflow actions and NuGet packages current with weekly pull requests.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
